<div class="auth-layout">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 4C9.37 4 4 9.37 4 16C4 22.63 9.37 28 16 28C22.63 28 28 22.63 28 16C28 9.37 22.63 4 16 4ZM16 24C11.58 24 8 20.42 8 16C8 11.58 11.58 8 16 8C20.42 8 24 11.58 24 16C24 20.42 20.42 24 16 24Z" fill="currentColor" fill-opacity="0.9"/>
          <circle cx="16" cy="16" r="4" fill="currentColor"/>
        </svg>
      </div>
      <h1 class="auth-title">Bienvenido a SIGEPSI</h1>
      <p class="auth-subtitle">Ingresa a tu cuenta para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <!-- Mensaje de Error Global -->
      <div *ngIf="errorMessage" class="alert alert--error">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
        <span>{{ errorMessage }}</span>
      </div>

      <div class="field">
        <label for="email" class="field__label">Correo electrónico</label>
        <div class="field__input-group">
          <span class="field__icon">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/></svg>
          </span>
          <input type="email" id="email" formControlName="email" class="field__input field__input--icon" placeholder="tu@correo.com" autocomplete="email">
        </div>
      </div>

      <div class="field">
        <div class="field__label-wrapper">
          <label for="password" class="field__label">Contraseña</label>
          <a routerLink="/password-reset" class="field__forgot-link">¿Olvidaste tu contraseña?</a>
        </div>
        <div class="field__input-group">
          <span class="field__icon">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/></svg>
          </span>
          <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password" class="field__input field__input--icon field__input--password" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="field__toggle-btn" (click)="togglePasswordVisibility()" aria-label="Mostrar/Ocultar contraseña">
            <!-- Icono Ojo abierto -->
            <svg *ngIf="!showPassword" viewBox="0 0 20 20" fill="currentColor"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/></svg>
            <!-- Icono Ojo cerrado -->
            <svg *ngIf="showPassword" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd"/><path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn--primary auth-submit" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Iniciar Sesión</span>
        <span *ngIf="isLoading" class="btn__loader"></span>
      </button>
    </form>
    
    <div class="auth-footer">
      <p>Protegido por SIGEPSI. Su privacidad clínica es nuestra prioridad.</p>
    </div>
  </div>
</div>
