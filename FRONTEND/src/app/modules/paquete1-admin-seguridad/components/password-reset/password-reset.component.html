<div class="auth-layout">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 6V42M24 42H16M24 42H32M10 14V22C10 29.732 16.268 36 24 36C31.732 36 38 29.732 38 22V14" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="auth-title">Recuperar Contraseña</h1>
      <p class="auth-subtitle">Ingresa tu correo para recibir un enlace seguro de recuperación</p>
    </div>

    <!-- Mensaje de Éxito -->
    <div *ngIf="successMessage" class="alert alert--success" style="display: flex; flex-direction: column; align-items: stretch; gap: 12px; margin-bottom: 24px;">
      <div style="display: flex; align-items: flex-start; gap: 8px;">
        <svg viewBox="0 0 20 20" fill="currentColor" style="width: 24px; height: 24px; flex-shrink: 0;"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
        <div>
          <strong>¡Enlace enviado!</strong>
          <p style="margin: 4px 0 0 0; color: var(--color-text-secondary);">Revisa tu bandeja de entrada o la carpeta de spam para encontrar el enlace de recuperación.</p>
        </div>
      </div>
      <button type="button" class="btn btn--outline" (click)="onResend()" [disabled]="isLoading" style="font-size: 13px; padding: 6px 12px; align-self: flex-end; margin-top: 4px;">
        Volver a enviar enlace
      </button>
    </div>

    <!-- Mensaje de Error -->
    <div *ngIf="errorMessage" class="alert alert--error" style="margin-bottom: 24px;">
      <svg viewBox="0 0 20 20" fill="currentColor" style="width: 20px; height: 20px;"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
      <span>{{ errorMessage }}</span>
    </div>

    <form *ngIf="!successMessage" [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="field">
        <label for="email" class="field__label">Correo electrónico</label>
        <div class="field__input-group">
          <span class="field__icon">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/></svg>
          </span>
          <input type="email" id="email" formControlName="email" class="field__input field__input--icon" placeholder="tu@correo.com">
        </div>
      </div>

      <button type="submit" class="btn btn--primary auth-submit" [disabled]="resetForm.invalid || isLoading">
        <span *ngIf="!isLoading">Enviar enlace de recuperación</span>
        <span *ngIf="isLoading" class="btn__loader"></span>
      </button>
    </form>
    
    <div class="auth-footer" *ngIf="!successMessage">
      <a routerLink="/login" class="back-link">
        Volver al inicio de sesión
      </a>
    </div>
  </div>
</div>
