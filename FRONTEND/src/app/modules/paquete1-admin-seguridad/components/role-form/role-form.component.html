<app-page-header
  eyebrow="CU4"
  title="Nuevo rol"
  subtitle="Crea un rol y asígnale permisos de acceso.">
  <div actions>
    <a routerLink="/roles" class="btn btn--outline">Cancelar</a>
  </div>
</app-page-header>

<div class="content-card">
  <form [formGroup]="roleForm" (ngSubmit)="onSubmit()" class="form">
    <div class="field">
      <label for="name" class="field__label">Nombre del rol</label>
      <input type="text" id="name" formControlName="name" class="field__input" placeholder="Ej: Recepcionista">
    </div>

    <div class="field">
      <label for="description" class="field__label">Descripción</label>
      <textarea id="description" formControlName="description" class="field__input" rows="3"
        placeholder="Responsabilidades del rol…"></textarea>
    </div>

    <div class="field">
      <label class="field__label">Permisos de acceso</label>
      <p class="field__hint-text">Selecciona lo que este rol podrá hacer.</p>
      <div formArrayName="permisos" class="perms-grid">
        <label
          *ngFor="let permiso of permisosFormArray.controls; let i = index"
          class="perm-item">
          <input type="checkbox" [formControlName]="i">
          <span>
            <strong>{{ permisosDisponibles[i].name }}</strong>
            <span class="perm-code">{{ permisosDisponibles[i].codename }}</span>
          </span>
        </label>
        <p *ngIf="permisosDisponibles.length === 0" class="field__hint-text">
          Cargando permisos…
        </p>
      </div>
    </div>

    <div *ngIf="errorMessage" class="alert alert--error">{{ errorMessage }}</div>

    <div class="form__actions">
      <button type="submit" class="btn btn--primary" [disabled]="roleForm.invalid || isLoading">
        {{ isLoading ? 'Creando…' : 'Crear rol' }}
      </button>
    </div>
  </form>
</div>
