<app-page-header
  eyebrow="CU3"
  title="Nuevo usuario"
  subtitle="Registra un miembro del equipo del centro y asígnale un rol.">
  <div actions>
    <a routerLink="/users" class="btn btn--outline">Cancelar</a>
  </div>
</app-page-header>

<div class="content-card">
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="form">
    <div class="form__row">
      <div class="field">
        <label for="first_name" class="field__label">Nombre</label>
        <input type="text" id="first_name" formControlName="first_name" class="field__input" placeholder="Ej: Ana">
      </div>
      <div class="field">
        <label for="last_name" class="field__label">Apellido</label>
        <input type="text" id="last_name" formControlName="last_name" class="field__input" placeholder="Ej: Rivas">
      </div>
    </div>

    <div class="form__row">
      <div class="field">
        <label for="email" class="field__label">Correo electrónico</label>
        <input type="email" id="email" formControlName="email" class="field__input" placeholder="ana@centro.com">
      </div>
      <div class="field">
        <label for="password" class="field__label">Contraseña temporal</label>
        <input type="password" id="password" formControlName="password" class="field__input" placeholder="••••••••">
        <div class="pw-checks">
          <span class="chip-toggle" [class.active]="hasMinLength">8+ caracteres</span>
          <span class="chip-toggle" [class.active]="hasUppercase">Mayúscula</span>
          <span class="chip-toggle" [class.active]="hasLowercase">Minúscula</span>
          <span class="chip-toggle" [class.active]="hasNumber">Número</span>
          <span class="chip-toggle" [class.active]="hasSpecialChar">Carácter especial</span>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="role_id" class="field__label">Rol en el sistema</label>
      <select id="role_id" formControlName="role_id" class="field__input">
        <option value="" disabled>Selecciona un rol…</option>
        <option *ngFor="let role of roles" [value]="role.id">{{ role.name }}</option>
      </select>
    </div>

    <label class="check-inline">
      <input type="checkbox" formControlName="is_active">
      <span>Usuario activo</span>
    </label>

    <div *ngIf="errorMessage" class="alert alert--error">{{ errorMessage }}</div>

    <div class="form__actions">
      <button type="submit" class="btn btn--primary" [disabled]="userForm.invalid || isLoading">
        {{ isLoading ? 'Guardando…' : 'Guardar usuario' }}
      </button>
    </div>
  </form>
</div>
