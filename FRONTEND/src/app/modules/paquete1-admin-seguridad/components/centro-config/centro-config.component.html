<div class="breadcrumbs">
  <span>Panel</span><span>›</span><span class="breadcrumb-current">Configuración del centro</span>
</div>

<app-page-header
  eyebrow="CU1 · HU-04"
  title="Perfil del centro psicológico"
  subtitle="Datos institucionales visibles para los pacientes.">
  <div actions>
    <button type="button" class="btn btn--primary" (click)="onSave()" [disabled]="isLoading">
      {{ isLoading ? 'Guardando…' : 'Guardar cambios' }}
    </button>
  </div>
</app-page-header>

<div *ngIf="loadError" class="alert-box alert-danger">
  No se pudo cargar la configuración.
  <button type="button" class="link-btn" (click)="loadConfig()">Reintentar</button>
</div>
<div *ngIf="successMessage" class="alert-box alert-success">{{ successMessage }}</div>
<div *ngIf="errorMessage" class="alert-box alert-danger">{{ errorMessage }}</div>

<div class="tabs-nav-bar">
  <button class="tab-nav-btn" [class.active]="activeTab === 'generales'" (click)="setTab('generales')">Datos generales</button>
  <button class="tab-nav-btn" [class.active]="activeTab === 'horarios'" (click)="setTab('horarios')">Horarios</button>
  <button class="tab-nav-btn" [class.active]="activeTab === 'especialidades'" (click)="setTab('especialidades')">Especialidades</button>
  <button class="tab-nav-btn" [class.active]="activeTab === 'branding'" (click)="setTab('branding')">Branding</button>
</div>

<div class="content-card">
  <!-- Generales -->
  <div *ngIf="activeTab === 'generales'" class="form">
    <div class="field">
      <label class="field__label">Nombre del centro</label>
      <input type="text" [(ngModel)]="centro.nombre" class="field__input">
    </div>
    <div class="form__row">
      <div class="field">
        <label class="field__label">Identificación fiscal / NIF / RIF</label>
        <input type="text" [(ngModel)]="centro.nif_rif" class="field__input">
      </div>
      <div class="field">
        <label class="field__label">Registro sanitario / licencia</label>
        <input type="text" [(ngModel)]="centro.registro_sanitario" class="field__input">
      </div>
    </div>
    <div class="field">
      <label class="field__label">Dirección</label>
      <input type="text" [(ngModel)]="centro.direccion" class="field__input">
    </div>
    <div class="form__row">
      <div class="field">
        <label class="field__label">Teléfono de atención</label>
        <input type="text" [(ngModel)]="centro.telefono" class="field__input">
      </div>
      <div class="field">
        <label class="field__label">Correo oficial</label>
        <input type="email" [(ngModel)]="centro.email" class="field__input">
      </div>
    </div>
    <div class="form__row">
      <div class="field">
        <label class="field__label">Modalidad de atención</label>
        <select [(ngModel)]="centro.modalidad" class="field__input">
          <option value="Presencial">Presencial</option>
          <option value="Telepsicología (Online)">Telepsicología (online)</option>
          <option value="Híbrida (Presencial + Telepsicología)">Híbrida</option>
        </select>
      </div>
      <div class="field">
        <label class="field__label">Línea directa de crisis (24/7)</label>
        <input type="text" [(ngModel)]="centro.linea_crisis" class="field__input">
      </div>
    </div>
  </div>

  <!-- Horarios -->
  <div *ngIf="activeTab === 'horarios'" class="form">
    <div class="form__row">
      <div class="field">
        <label class="field__label">Lunes a viernes</label>
        <input type="text" [(ngModel)]="centro.horarios_atencion['lunes_viernes']" class="field__input" placeholder="08:00 - 18:00">
      </div>
      <div class="field">
        <label class="field__label">Sábados</label>
        <input type="text" [(ngModel)]="centro.horarios_atencion['sabado']" class="field__input" placeholder="08:00 - 13:00">
      </div>
    </div>
  </div>

  <!-- Especialidades -->
  <div *ngIf="activeTab === 'especialidades'" class="form">
    <div class="chips-select">
      <span class="spec-tag" *ngFor="let esp of centro.especialidades; let i = index">
        {{ esp }}
        <button type="button" class="chip-x" (click)="removeEspecialidad(i)">&times;</button>
      </span>
      <span class="spec-tag spec-empty" *ngIf="centro.especialidades.length === 0">Sin especialidades</span>
    </div>
    <div class="add-row">
      <input type="text" [(ngModel)]="newEspecialidad" class="field__input"
        placeholder="Añadir especialidad" (keyup.enter)="addEspecialidad()">
      <button type="button" class="btn btn--outline" (click)="addEspecialidad()">Agregar</button>
    </div>
  </div>

  <!-- Branding -->
  <div *ngIf="activeTab === 'branding'" class="form">
    <div class="field">
      <label class="field__label">Color primario</label>
      <input type="color" [(ngModel)]="centro.primary_color" class="field__input">
    </div>
    <div class="field">
      <label class="field__label">URL del logo</label>
      <input type="text" [(ngModel)]="centro.logo_url" class="field__input" placeholder="https://…">
    </div>
  </div>
</div>
