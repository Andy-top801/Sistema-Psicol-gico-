<div class="auth-form">
  <div class="auth-top-hint">
    <span>¿Ya tienes credenciales?</span>
    <a routerLink="/login">Iniciar sesión</a>
  </div>

  <span class="role-pill">Acceso nivel superadmin</span>
  <h1 class="auth-title">Crear cuenta de administrador</h1>
  <p class="auth-subtitle">Gestión centralizada de la plataforma y sus centros.</p>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div *ngIf="errorMessage" class="alert alert--error">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="alert alert--success">{{ successMessage }}</div>

    <div class="field">
      <label class="field__label">Nombre completo <span class="text-danger">*</span></label>
      <input type="text" formControlName="fullName" class="field__input" placeholder="Dra. Carla Rivas">
    </div>

    <div class="field">
      <label class="field__label">Correo <span class="text-danger">*</span></label>
      <input type="email" formControlName="email" class="field__input" placeholder="tu@correo.com">
    </div>

    <div class="field">
      <label class="field__label">Contraseña <span class="text-danger">*</span></label>
      <input [type]="showPassword ? 'text' : 'password'" formControlName="password" class="field__input" placeholder="••••••••">
      <div class="pw-checks">
        <span class="chip-toggle" [class.active]="hasMinLength">8+ caracteres</span>
        <span class="chip-toggle" [class.active]="hasUppercase">Una mayúscula</span>
        <span class="chip-toggle" [class.active]="hasSpecialChar">Un carácter especial</span>
      </div>
    </div>

    <div class="field">
      <label class="field__label">Confirmar contraseña <span class="text-danger">*</span></label>
      <input [type]="showConfirmPassword ? 'text' : 'password'" formControlName="confirmPassword" class="field__input" placeholder="••••••••">
      <span *ngIf="registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched" class="text-danger">
        Las contraseñas no coinciden.
      </span>
    </div>

    <label class="terms-label">
      <input type="checkbox" formControlName="terms">
      <span>Acepto los Términos de Servicio y la Política de Privacidad.</span>
    </label>

    <button type="submit" class="btn btn--primary auth-submit" [disabled]="registerForm.invalid || isLoading">
      {{ isLoading ? 'Creando…' : 'Crear cuenta' }}
    </button>
  </form>
</div>
