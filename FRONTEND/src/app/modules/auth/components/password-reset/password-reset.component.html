<div class="auth-form">
  <h1 class="auth-title">Recuperar contraseña</h1>
  <p class="auth-subtitle">Ingresa tu correo para recibir un enlace seguro de recuperación.</p>

  <div *ngIf="successMessage" class="alert alert--success">
    <strong>Enlace enviado.</strong>
    <p class="mt-2">Si el correo está registrado, recibirás instrucciones para restablecer tu contraseña.</p>
    <button type="button" class="link-btn" (click)="onResend()" [disabled]="isLoading">Volver a enviar</button>
  </div>

  <div *ngIf="errorMessage" class="alert alert--error">{{ errorMessage }}</div>

  <form *ngIf="!successMessage" [formGroup]="resetForm" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="email" class="field__label">Correo electrónico</label>
      <input type="email" id="email" formControlName="email" class="field__input" placeholder="tu@correo.com">
    </div>
    <button type="submit" class="btn btn--primary auth-submit" [disabled]="resetForm.invalid || isLoading">
      {{ isLoading ? 'Enviando…' : 'Enviar enlace' }}
    </button>
  </form>

  <p class="auth-footer" *ngIf="!successMessage">
    <a routerLink="/login">Volver al inicio de sesión</a>
  </p>
</div>
