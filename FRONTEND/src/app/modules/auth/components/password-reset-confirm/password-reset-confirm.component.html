<div class="auth-form">
  <h1 class="auth-title">Crear nueva contraseña</h1>
  <p class="auth-subtitle">Ingresa tu nueva contraseña de seguridad.</p>

  <div *ngIf="errorMessage" class="alert alert--error">{{ errorMessage }}</div>

  <div *ngIf="successMessage" class="alert alert--success">
    <strong>{{ successMessage }}</strong>
    <p class="mt-2">Redirigiendo al inicio de sesión…</p>
  </div>

  <form *ngIf="!successMessage && token" [formGroup]="confirmForm" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="newPassword" class="field__label">Nueva contraseña</label>
      <input [type]="showPassword1 ? 'text' : 'password'" id="newPassword" formControlName="newPassword" class="field__input" placeholder="••••••••">
      <div class="pw-checks">
        <span class="chip-toggle" [class.active]="hasMinLength">8+ caracteres</span>
        <span class="chip-toggle" [class.active]="hasUppercase">Mayúscula</span>
        <span class="chip-toggle" [class.active]="hasLowercase">Minúscula</span>
        <span class="chip-toggle" [class.active]="hasNumber">Número</span>
        <span class="chip-toggle" [class.active]="hasSpecialChar">Carácter especial</span>
      </div>
    </div>

    <div class="field">
      <label for="confirmPassword" class="field__label">Confirmar contraseña</label>
      <input [type]="showPassword2 ? 'text' : 'password'" id="confirmPassword" formControlName="confirmPassword" class="field__input" placeholder="••••••••">
      <span *ngIf="confirmForm.hasError('mismatch') && confirmForm.get('confirmPassword')?.touched" class="text-danger">
        Las contraseñas no coinciden.
      </span>
    </div>

    <button type="submit" class="btn btn--primary auth-submit" [disabled]="confirmForm.invalid || isLoading">
      {{ isLoading ? 'Guardando…' : 'Cambiar contraseña' }}
    </button>
  </form>

  <p class="auth-footer" *ngIf="!successMessage">
    <a routerLink="/login">Volver al inicio de sesión</a>
  </p>
</div>
