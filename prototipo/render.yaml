# ==============================================================================
# RENDER BLUEPRINT (Infrastructure as Code) — SIGEPSI PLATFORM
# Documentación: https://render.com/docs/blueprint-spec
# ==============================================================================
version: "1"

databases:
  - name: sigepsi-postgres
    databaseName: sigepsi_db
    user: sigepsi_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  # ----------------------------------------------------------------------------
  # BACKEND SERVICE (Django REST + django-tenants + Gunicorn)
  # ----------------------------------------------------------------------------
  - type: web
    name: sigepsi-backend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./prototipo/backend/Dockerfile
    dockerContext: ./prototipo/backend
    healthCheckPath: /api/tenants/public/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sigepsi-postgres
          property: connectionString
      - key: DB_SSL_REQUIRE
        value: "true"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: PORT
        value: "10000"

  # ----------------------------------------------------------------------------
  # FRONTEND SERVICE (Angular 17 SPA + Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  - type: web
    name: sigepsi-frontend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./prototipo/web/Dockerfile
    dockerContext: ./prototipo/web
    envVars:
      - key: PORT
        value: "10000"
      - key: BACKEND_URL
        value: https://sigepsi-backend.onrender.com
